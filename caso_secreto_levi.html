<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#20152f">
<title>ARQUIVO 025 — Caso Levi Andrade</title>
<style>
:root{--bg:#171221;--panel:#241b32;--panel2:#30223f;--pink:#ff78ad;--cream:#fff2e7;--muted:#c9b9d4;--gold:#f6d58a;--line:#594466;--green:#a6edc1}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#38213f 0,#171221 58%);color:var(--cream);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.wrap{width:min(760px,100%);margin:auto;padding:18px 15px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:.78rem;letter-spacing:.12em;font-weight:800}.stamp{border:1px solid var(--pink);color:var(--pink);padding:7px 10px;transform:rotate(-3deg);font-size:.72rem;white-space:nowrap}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:17px 0}
.hero,.panel{background:linear-gradient(145deg,#2a2037ee,#201827f5);border:1px solid var(--line);border-radius:22px;padding:23px 19px;box-shadow:0 18px 45px #08050e55}
.kicker{font-size:.75rem;letter-spacing:.16em;color:var(--pink);font-weight:900;text-transform:uppercase}.symbol{font-size:3.2rem;margin:15px 0 5px}
h1{font-size:clamp(2rem,9vw,3.4rem);line-height:1.02;margin:9px 0 15px;letter-spacing:-.04em}h2{font-size:1.35rem;margin:9px 0 12px;color:var(--gold)}p{line-height:1.65;color:#eaddec}strong{color:#fff}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:17px 0}.tag{border:1px solid var(--line);border-radius:99px;padding:7px 10px;color:var(--muted);font-size:.8rem}
button{font:inherit;font-weight:800;cursor:pointer;border-radius:13px;padding:13px 15px;border:1px solid var(--line);color:var(--cream);background:#392946;width:100%;margin-top:9px;text-align:left}
button:hover{border-color:var(--pink);background:#49304e}button:disabled{opacity:.55;cursor:default}.primary{background:var(--pink);border-color:var(--pink);color:#281322;text-align:center}.primary:hover{background:#ff9ac2}.choice{display:flex;align-items:flex-start;gap:10px}.num{color:var(--pink);font-weight:900}
.small{font-size:.86rem;color:var(--muted)}.filebox{background:#191322;border:1px dashed #755981;border-radius:14px;padding:14px;margin:15px 0}.hidden{display:none!important}.progress{height:6px;background:#49344e;border-radius:99px;overflow:hidden;margin:15px 0 21px}.bar{height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));width:0;transition:width .3s}.topline{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem}.feedback{min-height:28px;color:var(--green);font-weight:700;margin:12px 0}.seal{border:1px solid var(--gold);padding:14px;border-radius:14px;text-align:center;color:var(--gold);font-weight:900;letter-spacing:.1em;margin:16px 0}.endnote{background:#342137;border-left:3px solid var(--pink);padding:15px;border-radius:0 12px 12px 0}.footer{text-align:center;color:#9b87a9;font-size:.78rem;margin-top:18px}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><span>DIVISÃO DE INVESTIGAÇÕES AFETIVAS</span><span class="stamp">CONFIDENCIAL</span></div>
  <div class="rule"></div>
  <div class="topline"><span>ARQUIVO Nº 025-LA</span><span id="count">0/5 pistas</span></div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <section id="app" class="hero" aria-live="polite"></section>
  <div class="footer">Documento confidencial • preparado especialmente para Levi Andrade, por Yasmin ♥</div>
</main>
<script>
const app=document.getElementById('app'),bar=document.getElementById('bar'),count=document.getElementById('count');
let found=new Set();
const cases=[
 {emoji:'🕵🏻‍♂️',title:'A primeira pista',subtitle:'LOCAL: MEMÓRIA',text:'Todo caso importante começa com uma pergunta. Neste arquivo, investigamos como uma pessoa pode virar parte tão especial da história de outra.',question:'Qual é a primeira regra desta investigação?',choices:['Ignorar os detalhes','Prestar atenção às pequenas lembranças','Pular direto para o final'],answer:1,clue:'PISTA 01 — Um olhar, um momento e uma lembrança que ficou.'},
 {emoji:'📱',title:'Rastro digital',subtitle:'LOCAL: CONVERSAS',text:'Os investigadores encontraram registros de conversas, risadas e mensagens. Nem toda lembrança precisa ser grandiosa para ter valor.',question:'O que transforma uma conversa simples numa lembrança especial?',choices:['O carinho e a pessoa com quem a gente conversa','Mandar só figurinha e fugir 😂','Ver quem demora mais para responder'],answer:0,clue:'PISTA 02 — Às vezes, uma conversa boba vira a parte favorita do dia.'},
 {emoji:'🧩',title:'A peça que faltava',subtitle:'LOCAL: APRENDIZADO',text:'O arquivo registra que toda história real tem dias fáceis e dias complicados. Uma boa equipe aprende a conversar, ouvir e tentar fazer melhor.',question:'Qual atitude ajuda a cuidar de uma relação?',choices:['Tentar vencer toda discussão','Escutar, conversar e tratar o outro com respeito','Fingir que o outro não sente nada'],answer:1,clue:'PISTA 03 — Não precisamos ser perfeitos; precisamos cuidar do que construímos.'},
 {emoji:'🔐',title:'A senha do arquivo',subtitle:'ACESSO RESTRITO',text:'Você chegou longe, agente Andrade. A senha não é uma data nem um número. É uma escolha que faz toda diferença.',question:'O que esta surpresa quer te lembrar?',choices:['Que você precisa merecer carinho sendo perfeito','Que pequenos gestos podem dizer “você é importante pra mim”','Que surpresa boa precisa custar caro'],answer:1,clue:'PISTA 04 — Esta investigação foi feita com tempo, carinho e pensando em você.'},
 {emoji:'💗',title:'O verdadeiro motivo',subtitle:'ARQUIVO FINAL',text:'Todas as pistas apontam para uma conclusão: esta não era uma investigação para descobrir um segredo ruim. Era uma forma diferente de te mostrar o quanto você é especial para mim.',question:'Pronto para abrir a conclusão confidencial?',choices:['Abrir o arquivo final 💌','Preciso de mais uma pista 👀'],answer:0,clue:'PISTA 05 — O segredo era o carinho por trás de cada detalhe.'}
];
function update(){count.textContent=found.size+'/5 pistas';bar.style.width=(found.size/5*100)+'%'}
function start(){app.innerHTML=`<div class="kicker">Arquivo confidencial • caso aberto</div><div class="symbol">🗂️</div><h1>O caso secreto:<br>Levi Andrade</h1><p>Agente Levi, você foi convocado para uma investigação muito particular. Há cinco pistas escondidas neste arquivo. Cada resposta correta revela um novo fragmento do caso.</p><div class="meta"><span class="tag">🔎 5 pistas</span><span class="tag">💌 1 segredo</span><span class="tag">🔓 Final desbloqueável</span></div><div class="filebox"><strong>OBJETIVO:</strong><br><span class="small">Investigar a origem desta surpresa e descobrir a mensagem confidencial.</span></div><button class="primary" onclick="showCase(0)">ACEITAR A MISSÃO →</button><p class="small">Aviso: este caso pode provocar sorrisos bobos. Prossiga por sua conta e risco. 😌</p>`}
function showCase(i){let c=cases[i];app.className='panel';app.innerHTML=`<div class="kicker">${c.subtitle}</div><div class="symbol">${c.emoji}</div><h2>${c.title}</h2><p>${c.text}</p><div class="rule"></div><strong>${c.question}</strong><div id="choices">${c.choices.map((x,j)=>`<button class="choice" onclick="choose(${i},${j},this)"><span class="num">0${j+1}</span><span>${x}</span></button>`).join('')}</div><div id="feedback" class="feedback"></div><div id="clue" class="filebox hidden"></div><button id="next" class="primary hidden" onclick="${i===4?'finale()':'showCase('+(i+1)+')'}">${i===4?'ABRIR CONCLUSÃO CONFIDENCIAL →':'ARQUIVAR PISTA E CONTINUAR →'}</button>`}
function choose(i,j,btn){let c=cases[i],feedback=document.getElementById('feedback'),clue=document.getElementById('clue'),next=document.getElementById('next');if(j===c.answer){found.add(i);update();document.querySelectorAll('#choices button').forEach(b=>b.disabled=true);feedback.textContent='ACESSO LIBERADO • resposta correta';clue.textContent=c.clue;clue.classList.remove('hidden');next.classList.remove('hidden')}else{feedback.textContent='A pista ainda não encaixou. Tenta outra opção, agente. 👀';btn.disabled=true}}
function finale(){app.className='hero';app.innerHTML=`<div class="kicker">Relatório concluído • acesso autorizado</div><div class="symbol">💌</div><h1>Segredo revelado.</h1><div class="seal">CASO ENCERRADO?<br>JAMAIS. ♥</div><p><strong>Levi,</strong> se você chegou até aqui, descobriu que este arquivo nunca foi sobre um mistério ruim. Foi meu jeito de transformar carinho em uma aventura só sua.</p><p>Eu gosto da nossa história, das lembranças que já temos e das que ainda podemos criar. Nem tudo precisa ser perfeito para ser importante. Quero continuar aprendendo com você, rindo das nossas besteiras e construindo momentos que um dia a gente vai lembrar com carinho.</p><div class="endnote">A conclusão oficial da investigação é esta: <strong>você é muito especial pra mim</strong>, e eu quis que você tivesse algo feito especialmente pensando em você.</div><p style="text-align:right"><strong>— Yasmin 💗</strong></p><div class="filebox"><strong>MISSÃO EXTRA:</strong><br><span class="small">Mande uma mensagem para a investigadora respondendo: qual pista você mais gostou e o que sentiu ao abrir este arquivo?</span></div><button class="primary" onclick="start()">REABRIR O ARQUIVO ↻</button>`}
start();update();
</script>
</body>
</html>
